;
; Here you will find additional settings for AKsearch. They are listed under the corresponding
; section that you will find in the "real" facets.ini.
;

; Additional settings for AKsearch in the [HomePage_Settings] section of facets.ini
[HomePage_Settings]
; Set facet.mincount. This specifies the minimum counts required for a facet value to be displayed.
; If a facet count is below this value, the value will not be displayed. See also:
; https://solr.apache.org/guide/faceting.html#field-value-faceting-parameters
facet_mincount = "2"
; Set facet.mincount on a per-field basis. See "facet_mincount" but do it for a specific field.
facet_mincount_by_field[my_solrfield1] = "3000"
facet_mincount_by_field[my_solrfield2] = "20"
; Set facet.excludeTerms to remove specific terms from the facet results. Separate multiple terms
; by comma. If a term that should be excluded contains a comma, escape it with backslash like "\,".
; Don't add a space before or after the commas that are used to separate multiple terms. See also:
; https://solr.apache.org/guide/faceting.html#field-value-faceting-parameters
facet_excludeterms = "Term1,Term2,Term3"
; Set facet.excludeTerms on a per-field basis. See "facet_excludeterms" but do it for a specific field.
facet_excludeterms_by_field[my_solrfield] = "Term1,Term2,Term3"

