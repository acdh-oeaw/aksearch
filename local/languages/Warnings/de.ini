; Translations for the header warning box
header_warning_heading = "Corona-Virus Information"
header_warning_text = "Wir freuen uns, ab <b>Montag, 14.12.2020</b> den Entlehnbetrieb wieder aufnehmen zu können! Ab diesem Datum können zuvor bestellte Medien <b>werktags von 10 bis 16 Uhr</b> abgeholt und Ausleihen retourniert werden. Die Bestellung von Medien ist schon ab Donnerstag, 10.12. möglich. Bereits bereitgestellte Bücher bleiben bis 23.12. abholbereit. Kopieren, Scannen und Drucken ist nach vorangegangener Terminvereinbarung via Mail an <a href="mailto:bibliothek@akwien.at">bibliothek@akwien.at</a> möglich. <b>Bitte zeigen Sie die entsprechende Benachrichtigung mit der Terminvereinbarung beim Betreten des Gebäudes vor.</b><br><br>Bitte informieren Sie sich auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a> über die aktuellen Maßnahmen. Auf ein persönliches Wiedersehen freut sich das Team der Bibliothek!"

