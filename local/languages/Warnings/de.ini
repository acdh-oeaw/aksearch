; Translations for the header warning box
header_warning_heading = "Corona-Virus Information"
header_warning_text = "Aufgrund der aktuellen Corona-Verordnung bleibt die <b>Bibliothek ab 1.4.2021 bis auf Weiteres geschlossen!</b> Entlehnfristen werden bis zur erneuten Öffnung der Bibliothek automatisch verlängert. Bereitgestellte Bücher bleiben im Regal. Buchbestellungen sind erst wieder bei einer erneuten Öffnung möglich. <b>Ausführlichere Informationen</b> finden Sie auf unserer <b><a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a></b>."

