; Translations for the header warning box
header_warning_heading = "Corona-Virus Information"
;header_warning_heading = "Servicunterbrechung und Corona-Virus Information"
header_warning_text = "Der Lesesaal ist <b>werktags von 10:00 - 19:30 Uhr</b> mit voller Platzzahl geöffnet. Eine Platzkarte mit zugewiesenem Sitzplatz erhalten Sie am Infoschalter. Das Tragen einer <b>FFP2-Maske ist jederzeit verpflichtend</b>. Zur Benützung nicht entlehnbarer Bestände sowie zum Kopieren, Scannen und Drucken ist eine <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> erforderlich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "Ab <b>Montag, 3.5.2021</b>, nehmen wir den Entlehnbetrieb wieder auf! Ab diesem Datum können zuvor bestellte Medien werktags von 10:00 bis 16:00 Uhr abgeholt und Ausleihen retourniert werden. Die Bestellung von Medien ist ab Donnerstag, 29.4.2021, möglich. Bereits bereitgestellte Bücher bleiben bis 14.5.2021 abholbereit. Kopieren, Scannen und Drucken ist nach vorheriger Terminvereinbarung via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> möglich. <b>Bitte zeigen Sie die Benachrichtigung mit der Terminvereinbarung beim Betreten des Gebäudes vor.</b><br />Ausführlichere Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "Ab 25.5.2021 ist der Lesesaal <b>werktags von 10:00 - 16:00 Uhr</b> mit einer <b>beschränkten Anzahl an Plätzen</b> geöffnet (Lesesaal: 8, Foyer: 7). Das Tragen einer <b>FFP2-Maske ist verpflichtend</b>. Die Abholung und Rückgabe von Medien ist zu den genannten Öffnungszeiten möglich. Entlehnbare Medien müssen online bestellt werden. Die Benützung nicht entlehnbarer Medien sowie Kopieren, Scannen und Drucken ist nach vorangegangener <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> möglich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "Der Lesesaal ist <b>werktags von 10:00 - 16:00 Uhr</b> mit einer <b>beschränkten Anzahl an Plätzen</b> geöffnet (Lesesaal: 17, Foyer: 15). Das Tragen einer <b>FFP2-Maske ist verpflichtend</b>. Die Abholung und Rückgabe von Medien ist zu den genannten Öffnungszeiten möglich. Entlehnbare Medien müssen online bestellt werden. Die Benützung nicht entlehnbarer Medien sowie Kopieren, Scannen und Drucken ist nach vorangegangener <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> möglich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "<p><b>Serviceunterbrechung:</b> Aufgrund von technischen Wartungsarbeiten kommt es von <b>18.10.2021 ab 19:30 Uhr bis 19.10.2021 um 07:00 Uhr</b> zu einer Serviceunterbrechung: AKsearch nicht erreichbar, kein Login in die <a href='https://ak.overdrive.com' target='_blank'>AK Bibliothek digital (OverDrive)</a> sowie die <a href='https://emedien.arbeiterkammer.at' target='_blank'>E-Medien</a>.</p><p><b>Corona:</b> Der Lesesaal ist <b>werktags von 10:00 - 19:30 Uhr</b> mit voller Platzzahl geöffnet. Eine Platzkarte mit zugewiesenem Sitzplatz erhalten Sie am Infoschalter. Das Tragen einer <b>FFP2-Maske ist jederzeit verpflichtend</b>. Zur Benützung nicht entlehnbarer Bestände sowie zum Kopieren, Scannen und Drucken ist eine <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> erforderlich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>.</p>"

; Translations for the homepage warning box
homepage_warning_heading = "Technische Wartungsarbeiten - Serviceunterbrechung"
homepage_warning_text = "<p>Aufgrund von technischen Wartungsarbeiten kommt es von</p><br /><p align='center'><b>Montag, 18.10.2021 ab ca. 19:30 Uhr bis Dienstag, 19.10.2021 um ca. 07:00 Uhr</b></p><br /><p>zu einer Serviceunterbrechung. Unsere Suchmaschine <b>AKsearch wird nicht erreichbar</b> sein. Der Login in die <b><a href='https://ak.overdrive.com' target='_blank'>AK Bibliothek digital (OverDrive)</a></b> und in die <b><a href='https://emedien.arbeiterkammer.at' target='_blank'>E-Medien der AK Bibliothek Wien</a></b> wird während dieser Zeit ebenfalls nicht möglich sein!</p>"

