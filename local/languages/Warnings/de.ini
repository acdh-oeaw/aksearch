; Activate warnings in "[Warnings]" section of config.ini
; Remove (or "comment out") the "..._heading" translations to just display the text without the heading. Don't just
; set to an empty string because this won't work! HTML tags can be used in "..._text" translations.

; Translations for the header warning box
header_warning_heading = "Corona-Virus Information"
header_warning_text = "Ab <b>Montag, 3.5.2021</b>, nehmen wir den Entlehnbetrieb wieder auf! Ab diesem Datum können zuvor bestellte Medien werktags von 10:00 bis 16:00 Uhr abgeholt und Ausleihen retourniert werden. Die Bestellung von Medien ist ab Donnerstag, 29.4.2021, möglich. Bereits bereitgestellte Bücher bleiben bis 14.5.2021 abholbereit. Kopieren, Scannen und Drucken ist nach vorheriger Terminvereinbarung via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> möglich. <b>Bitte zeigen Sie die Benachrichtigung mit der Terminvereinbarung beim Betreten des Gebäudes vor.</b><br />Ausführlichere Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."

