header_warning_heading = "Wartungsarbeiten am 24.10.2024"
;header_warning_heading = "Technische Probleme verhindern Login und Bestandsanzeige"
;header_warning_heading = "Wartungsarbeiten am 28.12.2023 vormittags"
;header_warning_heading = "Aktuelle Informationen"
;header_warning_heading = "Servicunterbrechung und Corona-Virus Information"
;header_warning_text = "Die Bibliothek schließt am <b>23.12.2021 bereits um 16:00 Uhr</b>! Vom <b>24.12.2021 bis 02.01.2022</b> ist die Bibliothek komplett geschlossen. Erster Öffnungstag ist Montag, der <b>03.01.2022</b>."
;header_warning_text = "(geänderte Öffnungszeiten, Coronaregelungen,…) finden Sie <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>hier</a>."
;header_warning_text = "Technische Probleme verhindern derzeit das Login ins Lesekonto sowie die korrekte Anzeige unseres Medienbestands. Die Probleme sollten bis spätesens morgen, 10.09.2024, behoben sein."
header_warning_text = "<p>Um unsere Services weiter ausbauen und verbessern zu können, müssen <b>am 24.10.2024 technische Wartungsarbeiten</b> durchgeführt werden. Dabei kommt es zu <b>kurzfristigen Serviceunterbrechungen</b>. Wir bitten um Ihr Verständnis.</p>"
;header_warning_text = "Unsere Services (AKsearch, OverDrive, Filmfriend) sind am <b>28.12. vormittags</b> nicht bzw. nur eingeschränkt zugänglich."
;header_warning_text = "Die Bibliothek ist von <b>Mo - Fr (werktags) zw. 10:00 und 19:30 Uhr</b> geöffnet. Es gilt ausnahmslos die <b>3G-Regelung (Geimpft, Genesen, Getestet)</b>! Das 3. G erfüllt entweder ein PCR-Test (Gültigkeit 48h, bis zum Ende des Aufenthalts) oder ein Antigentest (Gültigkeit 24h, bis zum Ende des Aufenthalts)! Das Tragen einer <b>FFP2-Maske ist jederzeit verpflichtend</b>. Eine Platzkarte mit zugewiesenem Sitzplatz erhalten Sie am Infoschalter. Bitte bestellen Sie entlehnbare Medien online via AKsearch. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>.<br /><br /><b>Neuer Service <i>filmfriend</i> ab sofort verfügbar</b>: Über die Streaming-Plattform <i><a href='https://akwien.filmfriend.at' target='_blank'>filmfriend</a></i> erhalten unsere Nutzer:innen kostenfreien Zugang zu mehr als 3500 hochwertigen Filmen, Serien und Dokus für alle Altersgruppen. Weitere Informationen finden Sie <a href='https://wien.arbeiterkammer.at/service/bibliothek/digitale_bibliothek/AK_Bibliothek_digital_via_filmfriend.html' target='_blank'>auf unserer Homepage</a>."
;header_warning_text = "Die Bibliothek ist derzeit regulär von <b>Mo - Fr (werktags) zwischen 10:00 - 19:30 Uhr</b> geöffnet. Es gilt ausnahmslos die <b>2G Regelung</b>! Das Tragen einer <b>FFP2-Maske ist jederzeit verpflichtend</b>. Eine Platzkarte mit zugewiesenem Sitzplatz erhalten Sie am Infoschalter. Zur Benützung nicht entlehnbarer Bestände sowie zum Kopieren, Scannen und Drucken ist eine <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> erforderlich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>.<br /><br /><b>Neuer Service <i>filmfriend</i> ab sofort verfügbar</b>: Über die Streaming-Plattform <i><a href='https://akwien.filmfriend.at' target='_blank'>filmfriend</a></i> erhalten unsere Nutzer:innen kostenfreien Zugang zu mehr als 3500 hochwertigen Filmen, Serien und Dokus für alle Altersgruppen. Weitere Informationen finden Sie <a href='https://wien.arbeiterkammer.at/service/bibliothek/digitale_bibliothek/AK_Bibliothek_digital_via_filmfriend.html' target='_blank'>auf unserer Homepage</a>."
;header_warning_text = "Ab <b>13.12.2021</b> ist die Bibliothek wieder geöffnet! Der Lesesaal ist <b>werktags von 10:00 - 19:30 Uhr</b> mit voller Platzzahl verfügbar. Eine Platzkarte mit zugewiesenem Sitzplatz erhalten Sie am Infoschalter. Das Tragen einer <b>FFP2-Maske ist jederzeit verpflichtend</b>. Zur Benützung nicht entlehnbarer Bestände sowie zum Kopieren, Scannen und Drucken ist eine <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> erforderlich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "Unsere Bibliothek bleibt für die Dauer der derzeitigen COVID-Maßnahmen <b>geschlossen</b>! Die Fristen entlehnter Bücher werden automatisch verlängert. Bereitgestellte Bücher können bis zu 2 Wochen ab Wiederöffnung abgeholt werden. Medienbestellungen sind erst wieder nach einer Bibliotheksöffnung möglich. Bitte informieren Sie sich via <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>, <a href='https://www.facebook.com/ak.bibliothek.wien' target='_blank'>Facebook</a>, <a href='https://www.instagram.com/ak.bibliothek.wien/' target='_blank'>Instagram</a> oder in unserem <a href='https://aksearch.arbeiterkammer.at/' target='_blank'>Onlinekatalog</a> über die aktuellen Maßnahmen."
;header_warning_text = "Der Lesesaal ist <b>werktags von 10:00 - 19:30 Uhr</b> mit voller Platzzahl geöffnet. Eine Platzkarte mit zugewiesenem Sitzplatz erhalten Sie am Infoschalter. Das Tragen einer <b>FFP2-Maske ist jederzeit verpflichtend</b>. Zur Benützung nicht entlehnbarer Bestände sowie zum Kopieren, Scannen und Drucken ist eine <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> erforderlich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "Ab <b>Montag, 3.5.2021</b>, nehmen wir den Entlehnbetrieb wieder auf! Ab diesem Datum können zuvor bestellte Medien werktags von 10:00 bis 16:00 Uhr abgeholt und Ausleihen retourniert werden. Die Bestellung von Medien ist ab Donnerstag, 29.4.2021, möglich. Bereits bereitgestellte Bücher bleiben bis 14.5.2021 abholbereit. Kopieren, Scannen und Drucken ist nach vorheriger Terminvereinbarung via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> möglich. <b>Bitte zeigen Sie die Benachrichtigung mit der Terminvereinbarung beim Betreten des Gebäudes vor.</b><br />Ausführlichere Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "Ab 25.5.2021 ist der Lesesaal <b>werktags von 10:00 - 16:00 Uhr</b> mit einer <b>beschränkten Anzahl an Plätzen</b> geöffnet (Lesesaal: 8, Foyer: 7). Das Tragen einer <b>FFP2-Maske ist verpflichtend</b>. Die Abholung und Rückgabe von Medien ist zu den genannten Öffnungszeiten möglich. Entlehnbare Medien müssen online bestellt werden. Die Benützung nicht entlehnbarer Medien sowie Kopieren, Scannen und Drucken ist nach vorangegangener <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> möglich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "Der Lesesaal ist <b>werktags von 10:00 - 16:00 Uhr</b> mit einer <b>beschränkten Anzahl an Plätzen</b> geöffnet (Lesesaal: 17, Foyer: 15). Das Tragen einer <b>FFP2-Maske ist verpflichtend</b>. Die Abholung und Rückgabe von Medien ist zu den genannten Öffnungszeiten möglich. Entlehnbare Medien müssen online bestellt werden. Die Benützung nicht entlehnbarer Medien sowie Kopieren, Scannen und Drucken ist nach vorangegangener <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> möglich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>."
;header_warning_text = "<p><b>Serviceunterbrechung:</b> Aufgrund von technischen Wartungsarbeiten kommt es von <b>18.10.2021 ab 19:30 Uhr bis 19.10.2021 um 07:00 Uhr</b> zu einer Serviceunterbrechung: AKsearch nicht erreichbar, kein Login in die <a href='https://ak.overdrive.com' target='_blank'>AK Bibliothek digital (OverDrive)</a> sowie die <a href='https://emedien.arbeiterkammer.at' target='_blank'>E-Medien</a>.</p><p><b>Corona:</b> Der Lesesaal ist <b>werktags von 10:00 - 19:30 Uhr</b> mit voller Platzzahl geöffnet. Eine Platzkarte mit zugewiesenem Sitzplatz erhalten Sie am Infoschalter. Das Tragen einer <b>FFP2-Maske ist jederzeit verpflichtend</b>. Zur Benützung nicht entlehnbarer Bestände sowie zum Kopieren, Scannen und Drucken ist eine <b>Terminvereinbarung</b> via Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a> erforderlich. Ausführliche Informationen finden Sie auf unserer <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>.</p>"

; Translations for the homepage warning box
homepage_warning_heading = "Technische Wartungsarbeiten - Serviceunterbrechung"
homepage_warning_text = "<p>Aufgrund von technischen Wartungsarbeiten kommt es von</p><br /><p align='center'><b>Montag, 18.10.2021 ab ca. 19:30 Uhr bis Dienstag, 19.10.2021 um ca. 07:00 Uhr</b></p><br /><p>zu einer Serviceunterbrechung. Unsere Suchmaschine <b>AKsearch wird nicht erreichbar</b> sein. Der Login in die <b><a href='https://ak.overdrive.com' target='_blank'>AK Bibliothek digital (OverDrive)</a></b> und in die <b><a href='https://emedien.arbeiterkammer.at' target='_blank'>E-Medien der AK Bibliothek Wien</a></b> wird während dieser Zeit ebenfalls nicht möglich sein!</p>"

