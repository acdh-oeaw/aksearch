; Activate warnings in "[Warnings]" section of config.ini
; Remove (or "comment out") the "..._heading" translations to just display the text without the heading. Don't just
; set to an empty string because this won't work! HTML tags can be used in "..._text" translations.

; Translations for the header warning box
header_warning_heading = "Corona-Virus information"
header_warning_text = "Due to the current Corona regulation, the <b>library will remain closed from April 1st, 2021 until further notice!</b> Loans are automatically renewed until reopening. Books on hold shelf will stay there. Placing orders will be possible again after reopening. Please find <b>detailed information on our <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>website</a></b> (german)."

; Translations for the homepage warning box
homepage_warning_heading = "HP Heading"
homepage_warning_text = "HP Text"

; Translations for the warning box on the "ILS holdings" tab in the record detail view
;holdingsils_warning_heading = "Corona-Virus information"
holdingsils_warning_text = "Attention: Library closed! <a href='https://wien.arbeiterkammer.at/service/bibliothek/bibliothek_nutzen/Corona_-_Eingeschraenkter_Bibliotheksbetrieb.html' target='_blank'>Further information (german)</a>"

; Translations for a warning box in the "place hold" form
;placehold_warning_heading = "Corona-Virus information"
placehold_warning_text = "<b>Please note that in the event of symptoms such as fever, sore throat, cough or loss of taste, it is strictly prohibited to enter the building!</b>"
