;holdingsils_warning_text = "Attention: changed opening times and usage conditions! <a href='https://wien.arbeiterkammer.at/service/bibliothek/bibliothek_nutzen/Corona_-_Eingeschraenkter_Bibliotheksbetrieb.html' target='_blank'>Further information (german)</a>"
