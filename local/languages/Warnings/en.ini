; Activate warnings in "[Warnings]" section of config.ini
; Remove (or "comment out") the "..._heading" translations to just display the text without the heading. Don't just
; set to an empty string because this won't work! HTML tags can be used in "..._text" translations.

; Translations for the header warning box
header_warning_heading = "Corona-Virus information"
;header_warning_heading = "Service interruption and Corona-Virus information"
;header_warning_text = "The library closes on <b>December 23rd, 2021 at 4 p.m.</b>! The library will be completely closed from <b>December 24th, 2021 to January 2nd, 2022</b>. The first opening day is Monday, <b>January 3rd 2022</b>."
header_warning_text = "The library is currently open from <b>Mo - Fr (weekdays) between 10:00 a.m. to 7:30 p.m.</b> The <b>2G regulation</b> applies without exception! Wearing an <b>FFP2 mask is obligatory</b> at any time. Using non-loanable media as well as copying, scanning and printing is possible after <b>prior appointment</b> via email to <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a>. Visit our <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>website</a> for further information (german)."
;header_warning_text = "Our library will be <b>closed</b> for the duration of the current COVID measures! Loans are renewed automatically. Books on the hold shelf can be collected up to 2 weeks after reopening. Orders of media are not possible during the closing time. Please find more information on our <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Homepage</a>, on <a href='https://www.facebook.com/ak.bibliothek.wien 'target='_blank'>Facebook</a>, on <a href='https://www.instagram.com/ak.bibliothek.wien/ 'target='_blank'>Instagram</a> or in our <a href='https://aksearch.arbeiterkammer.at/' target='_blank'>online catalog</a>."
;header_warning_text = "Our reading is open on <b>weekdays from 10:00 a.m. to 7:30 p.m.</b> with the full number of seats. Wearing an <b>FFP2 mask is obligatory</b> at any time. Using non-loanable media as well as copying, scanning and printing is possible after <b>prior appointment</b> via email to <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a>. Visit our <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>website</a> for further information (german)."
;header_warning_text = "We will resume loan/return operations on <b>May 3rd, 2021</b>. Previously ordered media can be picked up on weekdays from 10:00 a.m. to 4:00 p.m. Borrowed items can be returned within this time. Placing orders will be possible from <b>April 29th, 2021</b>. Books that have already been made available can be picked up until May 14th, 2021. Copying, scanning and printing is possible after prior appointment via email to <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a>. <b>Please show the notification with the appointment arrangement when entering the building.</b><br />Visit our <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Website</a> for further information (german)."
;header_warning_text = "Our reading room will re-open from May 25, 2021 on <b>weekdays from 10:00 a.m. to 4:00 p.m.</b> with a <b>limited number of places</b> (reading room: 8, foyer: 7). Wearing an <b>FFP2 mask is obligatory</b>. Media can be picked up and returned during the opening times. Loanable media must be ordered online. Using non-loanable media as well as copying, scanning and printing is possible after <b>prior appointment</b> via email to <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a>. Visit our <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>Website</a> for further information (german)."
;header_warning_text = "Our reading is open on <b>weekdays from 10:00 a.m. to 4:00 p.m.</b> with a <b>limited number of places</b> (reading room: 17, foyer: 15). Wearing an <b>FFP2 mask is obligatory</b>. Media can be picked up and returned during the opening times. Loanable media must be ordered online. Using non-loanable media as well as copying, scanning and printing is possible after <b>prior appointment</b> via email to <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a>. Visit our <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>website</a> for further information (german)."
;header_warning_text = "<p><b>Service interruption:</b> Technical maintenance from 18.10.2021, 19:30 until 19.10.2021, 07:00: AKsearch not available, no login to <a href='https://ak.overdrive.com' target='_blank'>AK Bibliothek digital (OverDrive)</a> and <a href='https://emedien.arbeiterkammer.at' target='_blank'>E-Media</a></b></p><p><b>Corona:</b> Our reading is open on <b>weekdays from 10:00 a.m. to 7:30 p.m.</b> with the full number of seats. Wearing an <b>FFP2 mask is obligatory</b> at any time. Using non-loanable media as well as copying, scanning and printing is possible after <b>prior appointment</b> via email to <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a>. Visit our <a href='https://wien.arbeiterkammer.at/service/bibliothek/index.html' target='_blank'>website</a> for further information (german).</p>"

; Translations for the homepage warning box
homepage_warning_heading = "Technical maintenance - service interruption"
homepage_warning_text = "There will be a service interruption from <b>Monday, October 18, 2021 from approx. 7:30 p.m. to Tuesday, October 19, 2021 at approx. 7:00 a.m.</b> due to technical maintenance. Our search engine <b>AKsearch will not be available</b>. The login to the <b><a href='https://ak.overdrive.com' target='_blank'>AK Bibliothek digital (OverDrive)</a></b> and the <b><a href='https://emedien.arbeiterkammer.at' target='_blank'>E-Media of the AK library</a></b> will also not be possible during the scheduled time!"

