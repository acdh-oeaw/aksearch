new_user_welcome_email_text = "%%salutation%% %%firstname%% %%lastname%%,<br /><br />vielen Dank für Ihr Interesse an der AK Bibliothek Wien. Ihr Username für unsere Services lautet:<br /><br />%%barcode%%<br /><br />Ihr Passwort haben Sie bereits bei der Registrierung festgelegt. Dieses wird aus Sicherheitsgründen nicht per E-Mail gesendet.<br /><br />Bei gleichzeitiger Übermittlung des österreichischen Meldezettels, erhalten Sie von uns noch gesondert eine E-Mail über die erfolgte Freischaltung Ihres Benutzerkontos.<br /><br />WICHTIG: Falls Sie den österreichischen Meldezettel noch nicht übermittelt haben, legen Sie bitte bei Ihrem ersten Besuch in der Bibliothek Ihren aktuellen österreichischen Meldezettel vor oder senden Sie ihn per E-Mail an <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a>. Dieses Dokument wird benötigt, um Sie für unsere Services freizuschalten und eine Lesekarte auszustellen.<br /><br />Für SchülerInnen:<br />Als Schüler/in sind Sie sicher besonders an unserer Sammlung VWA in der AK Bibliothek digital (siehe Link oben) interessiert. Sie finden darin Werke, die dem Verfassen von vorwissenschaftlichen Arbeiten dienen.<br /><br />Weitere Informationen finden Sie auf unserer Homepage unter <a href='https://wien.arbeiterkammer.at/bibliothek'>https://wien.arbeiterkammer.at/bibliothek</a><br /><br />Folgende Services können Sie mit Ihren neuen Zugangsdaten ab Freischaltung bis %%expiryDate%% uneingeschränkt nutzen (nach diesem Datum bitte Kontaktaufnahme mit der AK Bibliothek Wien zur Verlängerung Ihrer Berechtigung):<br /><br /> - Bibliothekskatalog: <a href='https://aksearch.arbeiterkammer.at'>https://aksearch.arbeiterkammer.at</a><br /> - AK Bibliothek digital E-Books: <a href='https://ak.ciando.com/'>https://ak.ciando.com/</a><br /> - AK Bibliothek digital E-Audiobooks: <a href='https://ak.overdrive.com/'>https://ak.overdrive.com/</a><br /><br />Wenn Sie noch Fragen oder Anregungen haben, können Sie sich gerne an uns wenden.<br /><br />Ihr Team der<br />AK Bibliothek Wien<br /><br />Prinz Eugen Straße 20-22<br />1040 Wien<br />Tel.: +43 1 50165 12352<br />E-Mail: <a href='mailto:bibliothek@akwien.at'>bibliothek@akwien.at</a><br />Web: <a href='https://wien.arbeiterkammer.at/bibliothek'>https://wien.arbeiterkammer.at/bibliothek</a>"
